# Copies the running page to alach.pl/running/ whenever index.html or runs.js changes on main.
# Only index.html and runs.js are uploaded; sat/ and avatar.jpg on the server are left alone.
# Upload: FTP with TLS. Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, optional FTP_DIR
# (Settings → Secrets and variables → Actions). The target folder is found by looking for sat/index.json,
# so the page can never be written anywhere else.
name: Deploy to alach.pl
on:
  push:
    branches: [main]
    paths: ['index.html', 'runs.js', '.github/workflows/deploy.yml']
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload over FTP with TLS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          ftp() { lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "set ftp:use-feat false; set ftp:ssl-force true; set ftp:ssl-protect-data true; set net:max-retries 2; set net:timeout 30; $1; bye"; }
          target=""
          for cand in "${FTP_DIR:-.}" "domains/pleksik.linuxpl.info/public_html/alach/running" "."; do
            if ftp "cls -1 '$cand/sat/index.json'" >/dev/null 2>&1; then target="$cand"; break; fi
          done
          if [ -z "$target" ]; then echo "::error::could not find the running page folder (no sat/index.json) on the FTP account"; exit 1; fi
          echo "::notice title=target::$target"
          ftp "cd '$target'; put index.html; put runs.js; cls -l index.html runs.js" 2>&1 | tail -n 5 | tr '\n' '|' | sed 's/^/::notice title=uploaded::/'; echo
          test "${PIPESTATUS[0]}" -eq 0
