# Copies the running page to alach.pl/running/ whenever index.html or runs.js changes on main.
# Only index.html and runs.js are uploaded; sat/ and avatar.jpg on the server are left alone.
# Upload goes over SSH (port 222) with a deploy key. Secret needed: SSH_KEY = the private key
# (Settings → Secrets and variables → Actions); its public half is added under "Klucze SSH" in the panel.
name: Deploy to alach.pl
on:
  push:
    branches: [main]
    paths: ['index.html', 'runs.js', '.github/workflows/deploy.yml']
  workflow_dispatch:
concurrency: deploy
env:
  SSH_HOST: s104.cyber-folks.pl
  SSH_PORT: '222'
  SSH_USER: pleksik
  TARGET_DIR: domains/pleksik.linuxpl.info/public_html/alach/running
  # server's ED25519 host key fingerprint, as shown in the panel under "Dostęp SSH"
  HOST_FP: SHA256:S2jwxJIpwev3UVG2wyoQmBOGlo5rsJdRhElr18Hm/mQ
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -o pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          # only talk to the real server: its key must match the fingerprint from the panel
          ssh-keygen -lf ~/.ssh/known_hosts | grep -q "$HOST_FP" || { echo "::error::server host key does not match $HOST_FP"; exit 1; }
          set +e
          scp -v -P "$SSH_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            index.html runs.js "$SSH_USER@$SSH_HOST:$TARGET_DIR/" > scp.log 2>&1
          rc=$?
          if [ $rc -eq 0 ]; then
            ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes "$SSH_USER@$SSH_HOST" "ls -l $TARGET_DIR/index.html $TARGET_DIR/runs.js" >> scp.log 2>&1
          fi
          grep -E 'Authenticat|denied|Permission|closed|Connection|subsystem|scp:|sftp|No such|Transferred|Exit status|debug1: Offering|accepted|refused|rsa|-rw' scp.log | tail -n 30 | tr '\n' '|' | sed 's/^/::notice title=upload log::/'; echo
          rm -f ~/.ssh/deploy_key
          exit $rc
