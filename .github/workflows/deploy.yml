# Copies the running page to alach.pl/running/ whenever index.html or runs.js changes on main.
# Only index.html and runs.js are uploaded; sat/ and avatar.jpg on the server are left alone.
# Secrets: FTP_SERVER (host only), FTP_USERNAME (full login), FTP_PASSWORD, FTP_DIR — Settings → Secrets and variables → Actions.
name: Deploy to alach.pl
on:
  push:
    branches: [main]
    paths: ['index.html', 'runs.js', '.github/workflows/deploy.yml']
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload over FTP with TLS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          d="${FTP_DIR:-.}"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:max-retries 2
          set net:timeout 30
          cd "$d"
          put index.html
          put runs.js
          ls -l index.html runs.js
          bye
          LFTP
