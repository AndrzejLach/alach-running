<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* phones: name, intro and goal first, then the map, then the rest of the column */
@media (max-width:760px){
  html body .side{display:contents}
  html body .side>div:first-child{order:0;position:static;margin:0;padding:18px 20px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  html body .goal{order:3;margin:0!important;padding:18px 20px 16px!important;background:var(--panel)}
  html body #infoBox{order:6;margin:0;padding:12px 20px;background:var(--panel)}
  html body .mapwrap{order:1}
  html body .side>section,html body .side>.note{order:7;margin:0;padding-left:20px;padding-right:20px;background:var(--panel)}
  html body .side>section:first-of-type{padding-top:20px;border-top:0}
  html body .side>.note{padding-bottom:28px}
}

/* intro line and latest strip */
.intro{margin:0;padding:14px 0 16px;font-size:14px;line-height:1.5;color:var(--muted);text-wrap:pretty}
.latest{display:flex;flex-direction:column;margin:-6px 0 18px;font-size:13px}
.latest div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.latest span{color:var(--muted);white-space:nowrap}
.latest b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.latest small{font-weight:500;margin-left:6px;white-space:nowrap}
.latest small.up{color:#2f8f4e}.latest small.down{color:#c0392b}
@media (max-width:760px){
  html body .intro{order:2;margin:0;padding:16px 20px 16px;background:var(--panel)}
  html body .side>div:first-child{border-bottom:0}
  html body .latest{order:4;margin:0;padding:0 20px 14px;background:var(--panel)}
}

.alsovisited{margin:14px 0 0;font-size:13px;line-height:1.9;color:var(--muted)}
html body .alsovisited .place.visited{display:inline;padding:0;border:0;background:none;font:inherit;color:var(--fg);cursor:pointer;min-height:0}
html body .alsovisited .place.visited:hover{text-decoration:underline}
html body .alsovisited .place.visited img{vertical-align:-2px}

/* next race */
.race{margin:-8px 0 16px;padding:8px 0 10px;border-bottom:1px solid var(--line)}
.race-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.race-top b{font-size:13px;font-weight:700;color:rgb(var(--track));white-space:nowrap}
.race-name{font-size:13px;font-weight:600;color:var(--fg);text-decoration:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.race-name:hover{text-decoration:underline}
.race-when{font-size:12px;color:var(--muted);margin-top:2px}
@media (max-width:760px){html body .race{order:5;margin:0;padding:6px 20px 12px;background:var(--panel)}}
</style></head><body>

<style>
/* Layout: full-height map canvas on the left, a scrolling control column on the right; stacks on phones */
:root{
  --bg:#F2F2F2; --panel:#FAFAFA; --fg:#1d2226; --muted:#5f6a72; --line:#d9dcde;
  --sea:#dbe2e6; --land:#f7f7f4; --coast:#c3ccd1; --veil:rgba(242,242,242,.62); --border:rgba(255,255,255,.85); --visit:rgba(255,255,255,.22); --visit-line:rgba(40,46,52,.55);
  --orange:#C77700; --track:184,106,0; --sel:#008c8c; --chip:#e6e8ea; --chip-on:#1d2226; --chip-on-fg:#F2F2F2;
  --display:"Geist",system-ui,-apple-system,sans-serif;
  --body:"Geist",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121518; --panel:#171b1f; --fg:#e7eaec; --muted:#93a0a8; --line:#2a3036;
  --sea:#0c0f12; --land:#1b2024; --coast:#2c343a; --veil:rgba(12,14,17,.66); --border:rgba(255,255,255,.4); --visit:rgba(255,255,255,.07); --visit-line:rgba(255,255,255,.5);
  --orange:#FFA62B; --track:255,166,43; --sel:#3ee0d0; --chip:#232a30; --chip-on:#e7eaec; --chip-on-fg:#121518; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121518; --panel:#171b1f; --fg:#e7eaec; --muted:#93a0a8; --line:#2a3036;
  --sea:#0c0f12; --land:#1b2024; --coast:#2c343a; --veil:rgba(12,14,17,.66); --border:rgba(255,255,255,.4); --visit:rgba(255,255,255,.07); --visit-line:rgba(255,255,255,.5);
  --orange:#FFA62B; --track:255,166,43; --sel:#3ee0d0; --chip:#232a30; --chip-on:#e7eaec; --chip-on-fg:#121518; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.app{display:flex;height:100%;min-height:0}
.mapwrap{position:relative;flex:1;min-width:0;background:var(--sea)}
canvas#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas#map.drag{cursor:grabbing}
.side{width:360px;flex:none;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);
  padding-block:20px 28px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.lbl{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.stat b{display:block;font-family:var(--display);font-weight:600;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px var(--body);border:0;border-radius:4px;background:var(--chip);color:var(--fg);padding:5px 9px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg)}
.chip:focus-visible,.place:focus-visible,.mapbtn:focus-visible,.bar:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.years{display:flex;align-items:flex-end;gap:3px;height:92px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;cursor:pointer;background:none;border:0;padding:0;color:var(--muted);font:500 10px var(--body);gap:3px;min-width:0}
.bar .stack{display:flex;flex-direction:column;width:100%}
.bar i{display:block;width:100%;background:rgba(var(--track),.6)}
.bar i.ng{background:repeating-linear-gradient(135deg,rgba(var(--track),.28) 0 3px,rgba(var(--track),.12) 3px 6px);border-radius:2px 2px 0 0}
.bar i.g:first-child{border-radius:2px 2px 0 0}
.bar[aria-pressed="true"] i.g{background:rgb(var(--track))}
.bar[aria-pressed="true"] i.ng{background:repeating-linear-gradient(135deg,rgba(var(--track),.5) 0 3px,rgba(var(--track),.25) 3px 6px)}
.legend{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px}
.bar[aria-pressed="true"]{color:var(--fg)}
.places{display:flex;flex-direction:column}
.place{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:7px 2px;color:var(--fg);font:inherit;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.place:hover{background:var(--chip)}
.place.visited{color:var(--muted)}
.place.visited .flagimg{opacity:.7}
.tabs{display:flex;align-items:baseline;gap:16px;margin-bottom:6px}
.tab{background:none;border:0;padding:0 0 4px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:rgb(var(--track))}
.tab:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.flagimg{display:inline-block;width:20px;height:15px;border-radius:2px;margin-right:8px;vertical-align:-2px;box-shadow:0 0 0 1px var(--line);object-fit:cover}
.tab .cnt{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:9px;background:var(--chip);color:var(--muted);font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:0;vertical-align:2px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .cnt{background:rgb(var(--track));color:#fff}
.tabnote{margin-left:auto;font-size:12px;color:var(--muted)}
.stat.sm b{font-size:21px}
.place .n{color:var(--muted);font-size:12px}
.place .k{min-width:62px;text-align:right}
.place small{color:var(--muted);font-size:12px;margin-left:4px}
.more{margin-top:6px}
.info{border:1px solid var(--line);border-left:3px solid var(--sel);padding:10px 12px;font-size:14px}
.info a{color:var(--sel)}
.info .t{font-family:var(--display);font-weight:600;font-size:19px}
.note{font-size:12px;color:var(--muted)}

const LAND = window.LAND_BASE; // from land.js; detailed outlines load later from land-fine.json

// ---------- projection (Web Mercator, unit square) ----------
const mx = lo => (lo + 180) / 360;
const my = la => { const s = Math.sin(la * Math.PI / 180); return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI); };

DATA.gps = DATA.gps.filter(w => w.type === 'Run');
DATA.nogps = DATA.nogps.filter(w => w.type === 'Run');
const W = DATA.gps.map(w => {
  const n = w.p.length / 2, xy = new Float64Array(n * 2);
  if (!n) return { ...w, xy, bb: null, yr: +w.d.slice(0, 4), la0: null, lo0: null }; // run from the latest export, track not loaded yet
  let x0 = 1, x1 = 0, y0 = 1, y1 = 0;
  for (let i = 0; i < n; i++) {
    const x = mx(w.p[2*i+1] / 1e5), y = my(w.p[2*i] / 1e5);
    xy[2*i] = x; xy[2*i+1] = y;
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  return { ...w, xy, bb: [x0, y0, x1, y1], yr: +w.d.slice(0, 4), la0: w.p[0] / 1e5, lo0: w.p[1] / 1e5 };
});
const projRings = rs => rs.map(r => { const a = new Float64Array(r.length); for (let i = 0; i < r.length; i += 2) { a[i] = mx(r[i+1] / 1e3); a[i+1] = my(r[i] / 1e3); } return a; });

// detailed coastlines are only needed when zoomed in, so they load after the page is up

const HL = Object.fromEntries(Object.entries(LAND.hl).map(([c, rs]) => [c, projRings(rs)]));

const CC = LAND.cc, ccName = c => CC[c] || c;

  renderGoal(); renderIntro(); renderRace();
  const gps = filtered();
  const ng = DATA.nogps.filter(w => w.type === 'Run' && (st.year == null || +w.d.slice(0, 4) === st.year));
  const tab = st.statTab || 'all';
  const list = tab === 'gps' ? gps : tab === 'nogps' ? ng : gps.concat(ng);
  const km = list.reduce((a, w) => a + (w.km || 0), 0), s = list.reduce((a, w) => a + (w.s || 0), 0);
  const valid = list.filter(w => w.km > 0.5 && w.s > 0);
  const pace = valid.reduce((a, w) => a + w.s, 0) / 60 / valid.reduce((a, w) => a + w.km, 0);
  const longest = list.reduce((m, w) => (w.km || 0) > (m ? m.km : 0) ? w : m, null);
  const days = new Set(list.map(w => w.d));
  const pf = p => isFinite(p) ? Math.floor(p) + ':' + String(Math.round(p % 1 * 60)).padStart(2, '0') : '–';
  const located = list.filter(w => w.cc);
  const places = new Set(located.map(w => w.place + '|' + w.cc)), cc = new Set(located.map(w => w.cc));
  const main = [[fmt(list.length), 'runs'], [fmt(km), 'km'], [fmt(s / 3600), 'hours']];
  const sub = [
    tab === 'nogps' ? ['Share of all runs', fmt(gps.length + ng.length ? ng.length / (gps.length + ng.length) * 100 : 0, 1) + '%'] : ['Places / countries', fmt(places.size) + ' / ' + cc.size],
    ['Average run', list.length ? fmt(km / list.length, 1) + ' km' : '–'], ['Average pace', pf(pace) + ' /km'],
    ['Longest run', longest ? '<small>' + longest.d + '</small>' + fmt(longest.km, 1) + ' km' : '–'], ['Days with a run', fmt(days.size)],
  ];
  const rows = `<div class="kpis">${main.map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`
    + `<dl class="facts">${sub.map(([l, v]) => `<div><dt>${l}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
  document.getElementById('stats').innerHTML = rows;
  document.querySelectorAll('#statTabs .tab').forEach(b => b.setAttribute('aria-selected', b.dataset.s === tab));
  const ds = gps.concat(ng).map(w => w.d).sort();
  document.getElementById('range').textContent = ds.length ? `Runs ${ds[0]} → ${ds[ds.length - 1]}${st.year ? ' · showing ' + st.year : ''}` : 'No runs for this filter';
}
document.querySelectorAll('#statTabs .tab').forEach(b => b.onclick = () => { st.statTab = b.dataset.s; renderStats(); });
function renderYears() {
  const g = {}, ng = {};
  for (const w of W) g[w.yr] = (g[w.yr] || 0) + (w.km || 0);
  for (const w of DATA.nogps) { const y = +w.d.slice(0, 4); ng[y] = (ng[y] || 0) + (w.km || 0); }
  const ys = [...new Set([...Object.keys(g), ...Object.keys(ng)].map(Number))].sort();
  const max = Math.max(...ys.map(y => (g[y] || 0) + (ng[y] || 0)));
  const h = v => v > 0 ? Math.max(2, v / max * 70) : 0;
  const el = document.getElementById('years');
  el.innerHTML = ys.map(y => `<button class="bar" type="button" data-y="${y}" aria-pressed="${st.year === y}" title="${y}: ${fmt(g[y] || 0)} km with GPS, ${fmt(ng[y] || 0)} km without GPS"><span class="stack"><i class="ng" style="height:${h(ng[y] || 0)}px"></i><i class="g" style="height:${h(g[y] || 0)}px"></i></span>${String(y).slice(2)}</button>`).join('');
  el.querySelectorAll('.bar').forEach(b => b.onclick = () => { const y = +b.dataset.y; st.year = st.year === y ? null : y; st.sel = null; refresh(true); });
}
function countryGroups() {
  const g = {};
  for (const p of placeGroups()) { const c = (g[p.cc] = g[p.cc] || { name: ccName(p.cc), cc: p.cc, n: 0, km: 0, places: 0, list: [], big: p }); c.n += p.n; c.km += p.km; c.places++; c.years = new Set([...(c.years || []), ...(p.years || [])]); c.list.push(...p.list); if (p.n > c.big.n) c.big = p; }
  return Object.values(g).map(c => ({ ...c, lat: c.big.lat, lon: c.big.lon })).sort((a, b) => b.n - a.n);
}
function renderPlaces() {
  const byCountry = st.tab === 'countries';
  document.getElementById('tabPlaces').setAttribute('aria-selected', !byCountry);
  document.getElementById('tabCountries').setAttribute('aria-selected', byCountry);
  { const runCC = activeCC(), nVis = VISITED.filter(v => !runCC.has(v.cc)).length;
    document.getElementById('tabPlaces').innerHTML = `Places <span class="cnt">${placeGroups().length}</span>`;
    document.getElementById('tabCountries').innerHTML = `Countries <span class="cnt">${countryGroups().length}${nVis ? ' + ' + nVis : ''}</span>`; }
  const arr = byCountry ? countryGroups() : placeGroups();
  const shown = st.showAllPlaces || byCountry ? arr : arr.slice(0, 12);
  const el = document.getElementById('places');
  el.innerHTML = shown.map((p, i) => byCountry
    ? `<button class="place" type="button" data-i="${i}"><span>${flag(p.cc)}${p.name}<small>${p.places} ${p.places === 1 ? 'place' : 'places'} · ${yearsLabel(p.years)}</small></span><span class="n">${fmt(p.n)}×</span><span class="k">${fmt(p.km)} km</span></button>`
    : `<button class="place" type="button" data-i="${i}"><span>${flag(p.cc)}${p.name}<small>${ccName(p.cc)} · ${yearsLabel(p.years)}</small></span><span class="n">${fmt(p.n)}×</span><span class="k">${fmt(p.km)} km</span></button>`).join('');
  if (byCountry) {
    const run = activeCC(), vis = VISITED.filter(v => !run.has(v.cc));
    if (vis.length) el.innerHTML += `<p class="alsovisited">Also visited, no runs yet: ` + vis.map((v, i) => `<button class="place visited" type="button" data-v="${i}">${flag(v.cc)}${ccName(v.cc)}</button>`).join(', ') + `</p>`;
    el.querySelectorAll('.place.visited').forEach(b => b.onclick = () => { const v = vis[+b.dataset.v]; openPlace({ ...v, list: [] }); });
  }
  el.querySelectorAll('.place:not(.visited)').forEach(b => b.onclick = () => openPlace(shown[+b.dataset.i]));
  const mb = document.getElementById('moreBtn'); mb.hidden = byCountry || arr.length <= 12;
  mb.textContent = st.showAllPlaces ? 'Show top 12' : `Show all ${arr.length} places`;
}
document.getElementById('tabPlaces').onclick = () => { st.tab = 'places'; renderPlaces(); };
document.getElementById('tabCountries').onclick = () => { st.tab = 'countries'; renderPlaces(); };
function renderInfo() {
  const box = document.getElementById('infoBox'), w = st.sel;
  box.hidden = !w; if (!w) return;
  const pace = w.km && w.s ? w.s / 60 / w.km : null;
  document.getElementById('info').innerHTML =
    `<div class="t">${w.type} · ${w.d}</div>
     <div>${w.place}${w.admin ? ', ' + w.admin : ''}, ${flag(w.cc)}${ccName(w.cc)}</div>
     <div>${w.km != null ? fmt(w.km, 2) + ' km' : ''}${w.s ? ' · ' + hms(w.s) : ''}${pace ? ' · ' + Math.floor(pace) + ':' + String(Math.round(pace % 1 * 60)).padStart(2, '0') + ' /km' : ''}${w.hr ? ' · ' + w.hr + ' bpm' : ''}</div>
     <div style="margin-top:4px"><a href="https://www.mapmyrun.com/workout/${w.id}" target="_blank" rel="noopener">Open in MapMyRun</a></div>`;
}
function refresh(refit) { renderStats(); renderYears(); renderPlaces(); renderInfo(); req(); }
document.getElementById('moreBtn').onclick = () => { st.showAllPlaces = !st.showAllPlaces; renderPlaces(); };

document.getElementById('globeBtn').onclick = () => {
  if (st.mode === 'globe') return;
  const lat = Math.atan(Math.sinh(Math.PI * (1 - 2 * view.cy))) / RAD, lon = view.cx * 360 - 180;
  globe.lon = lon; globe.lat = Math.max(-80, Math.min(80, lat)); globe.k = 0.42; setNav('globeBtn'); setMode('globe');
};
const home = () => { const g = {}; for (const w of W) if (w.bb) (g[placeKey(w)] = g[placeKey(w)] || []).push(w); const top = Object.values(g).sort((a, b) => b.length - a.length)[0]; fitList(top, 0.02); };
document.getElementById('fitHome').onclick = () => { setNav('fitHome'); setMode('map'); home(); };
const fitWorld = () => {
  if (cw / ch >= 1.3) return fitBox(0, my(78), 1, my(-58), 8);
  // narrow / portrait screens: fill the height and centre on Europe instead of showing a thin strip of world
  const y0 = my(72), y1 = my(-48);
  const z = Math.max(ch / (y1 - y0), cw, 200);
  if (st.animReady) animateView(mx(15), (y0 + y1) / 2, z); else { view.z = z; view.cx = mx(15); view.cy = (y0 + y1) / 2; req(); }
};
document.getElementById('mapBtn').onclick = () => { setNav('mapBtn'); setMode('map'); fitWorld(); };
document.getElementById('fitSel').onclick = () => { setNav('fitSel'); setMode('map'); fitList(filtered(), 0); };
document.getElementById('note').textContent = `Only runs are shown. ${fmt(DATA.nogps.length)} runs without GPS (treadmill or indoor) are not on the map.` + (W.some(w => !w.bb) ? ` ${W.filter(w => !w.bb).length} recent GPS runs (to ${W.filter(w => !w.bb).map(w => w.d).sort().pop()}) are counted but their tracks aren't on the map yet.` : '');

new ResizeObserver(resize).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', req);
new MutationObserver(req).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
(() => {
  const btn = document.getElementById('themeTog'), root = document.documentElement;
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : mq.matches;
  const label = () => btn.setAttribute('aria-label', isDark() ? 'Switch to light theme' : 'Switch to dark theme');
  let saved = null;
  try { saved = localStorage.getItem('rm-theme'); } catch (e) {}
  if (saved === 'light' || saved === 'dark') root.dataset.theme = saved;
  label();
  mq.addEventListener('change', label);
  btn.addEventListener('click', () => {
    const t = isDark() ? 'light' : 'dark';
    root.dataset.theme = t; label();
    try { localStorage.setItem('rm-theme', t); } catch (e) {}
  });
})();
st.nav = 'globeBtn'; resize(); refresh(); fitWorld(); setMode('globe');
st.animReady = true;
// gentle motion: repaint ~30 times a second on the globe (stars, orbits) and while the lap line fills in
GP.t0 = 1e15; // hold the line at zero until the first frames are on screen, then run the lap
setTimeout(() => requestAnimationFrame(() => requestAnimationFrame(() => { GP.t0 = performance.now() + 250; })), 50);
if (!RM) { let last = 0; const loop = now => { requestAnimationFrame(loop); if (document.hidden || now - last < 33 || ptrs.size) return; last = now; if (st.mode === 'globe' || (view.z < 20000 && performance.now() < GP.t0 + 3800)) draw(); }; requestAnimationFrame(loop); }
</script>
